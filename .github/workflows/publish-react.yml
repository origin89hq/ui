name: publish-react
on:
  push:
    tags: ['ui-react-v*']
permissions:
  contents: read
concurrency:
  group: publish-react
  cancel-in-progress: false
jobs:
  apple:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: swift test
      - name: Build for iOS Simulator
        run: swift build --scratch-path .build-ios --triple arm64-apple-ios17.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew check assembleRelease
        working-directory: platforms/compose
  publish:
    needs: [apple, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the release tag
        run: |
          version=$(node -p "require('./packages/react/package.json').version")
          test "$GITHUB_REF_NAME" = "ui-react-v$version" || { echo 'The tag must match the package version.'; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: ./.github/actions/setup-node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm check
      - run: pnpm run package
      - run: git diff --exit-code
      - name: Publish @origin89/ui-react
        run: |
          version=$(node -p "require('./packages/react/package.json').version")
          npm publish "dist/origin89-ui-react-$version.tgz" --provenance --access public
