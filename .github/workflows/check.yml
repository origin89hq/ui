name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-node
      - name: Validate pending changesets
        if: hashFiles('.changeset/*.md', '!.changeset/README.md') != ''
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git show-ref --verify --quiet "refs/heads/$BASE_BRANCH" || git branch --no-track "$BASE_BRANCH" "origin/$BASE_BRANCH"
          pnpm changeset status
      - run: pnpm check
  apple:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: swift test
      - name: Build for iOS Simulator
        run: swift build --scratch-path .build-ios --triple arm64-apple-ios17.0-simulator --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - run: ./gradlew check assembleRelease
        working-directory: platforms/compose
